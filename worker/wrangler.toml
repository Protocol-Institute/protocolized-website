name = "protocolized-website"
main = "src/index.tsx"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "7e8c7969b2464d23795c555bc6a32af8"

[[d1_databases]]
binding = "DB"
database_name = "protocolized-resources"
database_id = "1b47f2d7-9c84-4078-a27a-2f3eea9f41b7"

[[r2_buckets]]
binding = "FILES"
bucket_name = "protocolized-resources"

[assets]
directory = "./public"

[vars]
# Fiction split cutover (2026-10-11): fiction now lives at monstroustimes.com.
# "true" = fiction out of magazine/home/books/feeds/sitemap, and /p/, /books/
# 301 to Monstrous Times via fiction_redirects (loaded from
# data/monstroustimes-map.json). Fiction resource cards stay in /resources,
# linking out. "false" restores pre-cutover behavior.
FICTION_SEGREGATION_ACTIVE = "true"
