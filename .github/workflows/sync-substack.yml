name: Sync Substack Posts

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Python dependencies
        run: pip install feedparser

      - name: Install worker dependencies (wrangler + R2/D1)
        run: npm ci
        working-directory: worker

      - name: Sync Substack posts to D1 + R2
        run: python3 scripts/sync-substack.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Commit state if updated
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/.substack-sync-state.json
          if git diff --cached --quiet; then
            echo "No new posts — state unchanged"
          else
            COUNT=$(git show --stat HEAD 2>/dev/null | grep -c "sync" || echo 0)
            git commit -m "chore: substack D1 sync $(date -u +%Y-%m-%d)"
            git push
          fi
